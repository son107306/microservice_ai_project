
services:
  core-service:
    build:
      context: ./core_service
    container_name: quiz-core-service
    ports:
      - "8001:8001"
    restart: unless-stopped

  job-service:
    build:
      context: ./job_service
    container_name: quiz-job-service
    ports:
      - "8002:8002"
    restart: unless-stopped

services:
  core-service:
    build:
      context: .
      dockerfile: core_service/Dockerfile
    container_name: quiz-core-service
    ports:
      - "8001:8001"
    restart: unless-stopped

  job-service:
    build:
      context: .
      dockerfile: job_service/Dockerfile
    container_name: quiz-job-service
    ports:
      - "8002:8002"
    environment:
      CORE_SERVICE_URL: http://core-service:8001
    env_file:
      - .env
    depends_on:
      - core-service
    restart: unless-stopped